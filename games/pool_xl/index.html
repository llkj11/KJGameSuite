<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool XL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Pool XL</h1>
    <div class="game-container">
        <canvas id="poolTable" width="1000" height="500"></canvas>
        <div class="aim-indicator-container"> 
            <canvas id="indicatorCanvas" width="100" height="100"></canvas>
            <p>WASD to adjust aim point</p>
        </div>
    </div>

    <div class="instructions">
        Arrow Keys: Move Cue Stick (Keyboard Aim)<br>
        Spacebar: Hold & Release to Shoot (Keyboard)<br>
        Mouse: Aim & Hold LMB to Shoot
    </div>

    <button onclick="window.location.href='../../index.html'">Back to Game Suite</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
