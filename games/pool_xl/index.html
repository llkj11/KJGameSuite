<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool XL</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
    <div class="game-container">
        <h1>Pool XL</h1>
        <canvas id="poolTable" width="800" height="400"></canvas>
        <div id="ballIndicator" class="indicator-window">
             <h2>Cue Ball Aim</h2>
             <canvas id="indicatorCanvas" width="100" height="100"></canvas>
             <p>WASD to adjust aim point</p>
        </div>
         <div class="controls-info">
             <p>Arrow Keys: Move Cue Stick</p>
             <p>Spacebar: Hold & Release to Shoot</p>
         </div>
        <a href="../../index.html">Back to Game Suite</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
